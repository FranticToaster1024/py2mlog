[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "py2mlog"
version = "0.1.0"
description = "A python to mindustry logic (mlog) compiler."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []


[tool.pyright]
pythonVersion = "3.10"


[tool.black]
target-version = ["py310"]


[tool.hatch.build.targets.wheel]
packages = ["src/py2mlog"]


[tool.hatch.envs.default]
python = "3.10"


[tool.hatch.envs.test]
dependencies = [
    "pytest",
]

[tool.hatch.envs.test.scripts]
run = "pytest"


[tool.hatch.envs.format]
dependencies = [
    "black",
]

[tool.hatch.envs.format.scripts]
run = "black ."
check = "black . --check --diff"