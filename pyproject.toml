[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "py2mlog"
version = "0.1.0"
description = "A python to mindustry logic (mlog) compiler."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []


[project.scripts]
py2mlog = "py2mlog.__main__:main"


[project.optional-dependencies]
dev = [
    "pytest",
    "pyright",
    "ruff==0.17.3",
]


[tool.hatch.build.targets.wheel]
packages = ["src/py2mlog"]


[tool.hatch.envs.default]
python = "3.12"
features = ["dev"]

[tool.hatch.envs.default.scripts]
type-check = "pyright ."


[tool.hatch.envs.hatch-check-code]
config-path = "ruff_defaults.toml"
dependencies = ["ruff==0.17.3"]

[tool.hatch.envs.hatch-check-fmt]
config-path = "ruff_defaults.toml"
dependencies = ["ruff==0.17.3"]

[tool.hatch.envs.hatch-static-analysis]
config-path = "ruff_defaults.toml"
dependencies = ["ruff==0.17.3"]


[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12", "3.14"]


[tool.ruff]
target-version = "py312"
extend = "ruff_defaults.toml"
line-length = 80

[tool.ruff.lint]
extend-select = ["I", "UP", "SIM", "TCH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["FLY002", "S101"]

[tool.ruff.format]
quote-style = "double"


[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
extraPaths = ["./src"]