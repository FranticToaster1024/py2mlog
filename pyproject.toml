[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "py2mlog"
version = "0.1.0"
description = "A python to mindustry logic (mlog) compiler."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []


[tool.pyright]
pythonVersion = "3.10"


[tool.black]
target-version = ["py310"]


[tool.hatch.build.targets.wheel]
packages = ["src/py2mlog"]


[tool.hatch.envs.default]
python = "3.10"
dependencies = [
    "pytest",
    "black",
]

[tool.hatch.envs.default.scripts]
test = "pytest"
format = "black ."
format-check = "black . --check --diff"
