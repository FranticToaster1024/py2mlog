name: CI

on: [push, pull_request]

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install Hatch
      run: pipx install hatch

    - name: Check code formatting
      run: hatch check fmt
    
    - name: Check lint rules
      run: hatch check code
    
    - name: Check code typing
      run: hatch run type-check


  tests:
    needs: static-checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Hatch
      run: pipx install hatch

    - name: Test code
      run: hatch test --python ${{ matrix.python-version }}


  update-web-whl:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install Hatch
      run: pipx install hatch
    
    - name: Build wheel
      run: hatch build -t wheel

    - name: Copy wheel into web folder
      run: cp dist/*.whl web/py2mlog.whl

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: 'web/'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5