name: CI

on: [push, pull_request]

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Hatch
      run: pipx install hatch

    - name: Check code formatting
      run: hatch check fmt
    
    - name: Check lint rules
      run: hatch check code
    
    - name: Check code typing
      run: hatch run type-check


  tests:
    needs: static-checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Hatch
      run: pipx install hatch

    - name: Test code
      run: hatch test --python ${{ matrix.python-version }}


  check-stub-gen:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install packages
      run: pip install -e ".[dev]"

    - name: Generated stub
      run: python src/py2mlog/scripts/stub_gen.py
    
    - name: Check generated stub
      run: git diff --exit-code -- src/py2mlog/scripts/stub_gen.py
    

  update-whl-and-deploy:
    needs: check-stub-gen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write


    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install Hatch
      run: pipx install hatch
    
    - name: Build wheel
      run: hatch build -t wheel

    - name: Copy wheel into web folder
      # lie about the version so bumping version doesn't break stuff
      run: cp dist/*.whl web/py2mlog-0.0.0-py3-none-any.whl

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: 'web/'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5